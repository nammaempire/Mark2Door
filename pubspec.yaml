name: mart2door
description: mart2door - hyperlocal e-commerce customer app.
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.6.1
  go_router: '>=14.0.0 <19.0.0'
  shared_preferences: ^2.2.0
  firebase_core: '>=3.0.0 <6.0.0'
  firebase_auth: '>=5.0.0 <8.0.0'
  cloud_firestore: '>=5.0.0 <8.0.0'
  firebase_messaging: ^17.1.0
  geolocator: ^14.1.2
  razorpay_flutter: ^1.3.7
  url_launcher: ^6.2.0
  cloud_functions: ">=5.0.0 <8.0.0"
  # Order invoice: built as a PDF on the phone, then saved or shared.
  pdf: '>=3.10.0 <4.0.0'
  printing: '>=5.11.0 <6.0.0'
  cached_network_image: '>=3.4.0 <5.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/m2d_logo.png

  # The app's own copy of Roboto, so text is the same size and shape on
  # every phone. Without it, phones whose maker or owner changed the
  # system font draw wider text, which overflows cards.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Black.ttf
          weight: 900
